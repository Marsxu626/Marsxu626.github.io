<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tech Blog · 技术文章</title>
  <meta name="description" content="一个 GitHub 风格的个人技术博客，分享编程、AI、工具和工程实践">
  <link rel="stylesheet" href="css/style.css">
  <!-- highlight.js 主题（由 JS 动态切换深浅色） -->
  <link id="hljs-theme" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
</head>
<body>

<!-- ========== Header ========== -->
<header class="site-header">
  <div class="header-inner">
    <a class="site-brand" href="index.html">
      <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/></svg>
      <span class="label">My Blog</span>
    </a>
    <nav class="site-nav">
      <a href="index.html">文章</a>
      <a href="https://github.com/" target="_blank" rel="noopener">GitHub</a>
      <button id="theme-toggle" class="theme-toggle" aria-label="切换主题">
        <!-- 月亮图标 (浅色模式显示) -->
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><path d="M9.598 1.591a.75.75 0 0 1 .785-.175 7.001 7.001 0 1 1-8.967 8.967.75.75 0 0 1 .961-.96 5.5 5.5 0 0 0 7.045-7.046.75.75 0 0 1 .176-.786Z"/></svg>
      </button>
    </nav>
  </div>
</header>

<!-- ========== Main ========== -->
<main class="container">

  <!-- Hero -->
  <section class="hero">
    <h1>你好，世界 👋</h1>
    <p>这里是我的技术写作空间 — 编程技巧、AI 探索、工具分享和工程复盘。文章会持续更新，欢迎 Star 收藏。</p>
    <span class="gh-badge">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M8 .25a.75.75 0 0 1 .673.418l1.882 3.815 4.21.612a.75.75 0 0 1 .416 1.279l-3.046 2.97.719 4.192a.751.751 0 0 1-1.088.791L8 12.347l-3.766 1.98a.75.75 0 0 1-1.088-.79l.72-4.194L.818 6.374a.75.75 0 0 1 .416-1.28l4.21-.611L7.327.668A.75.75 0 0 1 8 .25Z"/></svg>
      <span>基于 Markdown · GitHub Pages 可部署</span>
    </span>
  </section>

  <!-- 文章列表 -->
  <section>
    <h2 class="section-title">
      最新文章
      <span class="count" id="article-count">0</span>
    </h2>
    <div class="article-list" id="article-list">
      <div class="loading">加载中...</div>
    </div>
  </section>

</main>

<!-- ========== Footer ========== -->
<footer class="site-footer">
  <p>© 2026 · Built with ♥ using vanilla HTML/CSS/JS · Deploy on <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a></p>
</footer>

<!-- marked.js (Markdown 解析) -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<!-- highlight.js (代码高亮) -->
<script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
<!-- 文章数据 -->
<script src="js/articles.js"></script>
<!-- 主逻辑 -->
<script src="js/main.js"></script>

</body>
</html>
